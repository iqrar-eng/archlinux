bind-key space switch-client -T leader
bind-key -T leader ? display-popup -E -w 100% -h 100% -B "~/archlinux/.config/tmux/bin/which-key"
bind-key -T leader q kill-server
bind-key -T leader c new-window -c "#{pane_current_path}"
bind-key -T leader y run-shell -b "tmux set-buffer '#{pane_current_path}' && tmux save-buffer - | wl-copy"
bind-key -T leader s run-shell "tmux source ~/.config/tmux/tmux.conf" \; display-message "tmux.conf sourced"

bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi p send-keys -X copy-pipe-and-cancel "tmux paste-buffer -p"
bind -T copy-mode-vi d send-keys -X copy-pipe-and-cancel "hyprctl dispatch 'hl.dsp.focus({ workspace = \"1\" })' >/dev/null \
  && ~/archlinux/.config/hypr/bin/paste"

# ------------------------------------------------

bind-key -r & kill-window
bind-key -r x kill-pane

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g default-terminal "tmux-256color"
set -g terminal-features ",xterm-kitty:hyperlinks"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 1
set -g status-keys vi
set -g mode-keys vi
set -g extended-keys on
set -g renumber-windows on
source-file ~/archlinux/.config/tmux/theme.conf

set -g status-right "#(cat /sys/class/power_supply/BAT0/capacity)%"
